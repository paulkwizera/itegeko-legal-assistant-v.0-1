<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up — Itegeko</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version('css/style.css') }}">
    <script src="{{ url_for('static', filename='js/auth.js') }}?v={{ asset_version('js/auth.js') }}" defer></script>
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-emblem">⚖</div>
            <div class="auth-title">Itegeko</div>
        </div>
        <p class="auth-sub">Create an account to save your conversations.</p>

        {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Name
                <input type="text" name="name" required autofocus autocomplete="name">
            </label>
            <label>Email
                <input type="email" name="email" required autocomplete="email">
            </label>
            <label>Password
                <div class="password-field">
                    <input type="password" name="password" required minlength="8" autocomplete="new-password">
                    <button type="button" class="password-toggle-btn" aria-label="Show password" onclick="togglePasswordVisibility(this)">
                        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </label>

            <label class="consent-field">
                <input type="checkbox" name="terms_accepted" required>
                <span>I agree to the <a href="{{ url_for('terms') }}" target="_blank">Terms of Service</a> and <a href="{{ url_for('privacy') }}" target="_blank">Privacy Policy</a>.</span>
            </label>
            <label class="consent-field">
                <input type="checkbox" name="marketing_consent">
                <span>I'd like to receive occasional emails about new features and offers.</span>
            </label>
            <label class="consent-field">
                <input type="checkbox" name="training_consent">
                <span>I agree that my conversations may be used to help improve and train Itegeko's AI models in the future.</span>
            </label>

            <button type="submit" class="auth-submit">Sign up</button>
        </form>
        <p class="auth-legal">By signing up you agree to get general legal information only — not advice from a licensed advocate.</p>

        <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
</body>
</html>
