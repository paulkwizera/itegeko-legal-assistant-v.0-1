<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a new password — Itegeko</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version('css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-emblem">⚖</div>
            <div class="auth-title">Itegeko</div>
        </div>

        {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
        {% if success %}<div class="auth-success">{{ success }}</div>{% endif %}

        {% if token_valid %}
        <p class="auth-sub">Choose a new password for your account.</p>
        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>New password
                <input type="password" name="password" required minlength="8" autofocus autocomplete="new-password">
            </label>
            <button type="submit" class="auth-submit">Set new password</button>
        </form>
        {% elif not success %}
        <p class="auth-sub">This link may have expired.</p>
        <a href="{{ url_for('auth_email.forgot_password') }}" class="auth-submit pricing-btn">Request a new link</a>
        {% endif %}

        <p class="auth-switch"><a href="{{ url_for('auth.login') }}">← Back to log in</a></p>
    </div>
</body>
</html>
